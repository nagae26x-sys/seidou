<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>制動距離シミュレーター Ver5</title>
<style>
body{font-family:"Yu Gothic",sans-serif;background:#f5f5f5;text-align:center;margin:20px}
.control{margin:10px}
button,input,select{font-size:1.1rem;padding:8px}

#viewport{
width:95%;
max-width:1000px;
height:220px;
margin:20px auto;
border:3px solid #444;
overflow-x:auto;
overflow-y:hidden;
background:#ddd;
}

#world{
position:relative;
width:14000px;
height:200px;
}

#road{
position:absolute;
top:110px;
left:0;
width:14000px;
border-top:6px dashed #666;
}

#car{
position:absolute;
left:40px;
top:50px;
font-size:60px;
}

.flag{
position:absolute;
top:15px;
transform:translateX(-50%);
text-align:center;
font-size:16px;
font-weight:bold;
}

#result{
font-size:1.3rem;
font-weight:bold;
margin-top:10px;
}

table{
margin:20px auto;
border-collapse:collapse;
background:white;
}

th,td{
border:1px solid #888;
padding:8px 15px;
}

th{
background:#efefef;
} </style>

</head>
<body>

<h1>🚗 制動距離シミュレーター Ver5</h1>

<div class="control">
速度(km/h)
<input type="number" id="speed" value="40" min="10" max="100">
</div>

<div class="control">
路面
<select id="surface">
<option value="0.005">乾燥</option>
<option value="0.0075">濡れ</option>
<option value="0.015">雪道</option>
<option value="0.03">凍結路</option>
</select>
</div>

<div class="control">
<button id="startBtn" onclick="startSimulation()">スタート</button>
<button onclick="resetAll()">リセット</button>
</div>

<div id="viewport">
 <div id="world">
   <div id="road"></div>
   <div id="car">🚗</div>
 </div>
</div>

<div id="result">速度を設定してスタートしてください</div>

<h2>実験記録</h2>

<table>
<thead>
<tr>
<th>速度(km/h)</th>
<th>路面</th>
<th>制動距離(m)</th>
</tr>
</thead>
<tbody id="history">
</tbody>
</table>

<script>
let running = false;
let timer = null;

function startSimulation(){

 if(running) return;

 running = true;
 document.getElementById("startBtn").disabled = true;

 const speed = Number(document.getElementById("speed").value);
 const k = Number(document.getElementById("surface").value);

 const surface =
 document.getElementById("surface")
 .options[document.getElementById("surface").selectedIndex].text;

 const distance = k * speed * speed;

 const scale = 18;
 const target = 40 + distance * scale;

 const car = document.getElementById("car");

 let pos = 40;
 let velocity = Math.max(speed / 12, 0.8);

 car.style.left = "40px";

 timer = setInterval(()=>{

   pos += velocity;

   if(pos > target){
      pos = target;
   }

   velocity *= 0.995;

   car.style.left = pos + "px";

   if(pos >= target){

      clearInterval(timer);

      addFlag(target,speed,distance);

      addHistory(speed,surface,distance);

      document.getElementById("result").innerHTML =
      `速度：${speed} km/h<br>
       路面：${surface}<br>
       制動距離：${distance.toFixed(1)} m`;

      setTimeout(()=>{
          car.style.left = "40px";
          running = false;
          document.getElementById("startBtn").disabled = false;
      },800);
   }

 },20);
}

function addFlag(x,speed,distance){

 const flag = document.createElement("div");

 flag.className = "flag";

 flag.style.left = x + "px";

 flag.innerHTML =
 `🏁<br>${speed}km/h<br>${distance.toFixed(0)}m`;

 document.getElementById("world").appendChild(flag);
}

function addHistory(speed,surface,distance){

 const row = document.createElement("tr");

 row.innerHTML =
 `
 <td>${speed}</td>
 <td>${surface}</td>
 <td>${distance.toFixed(1)}</td>
 `;

 document.getElementById("history").appendChild(row);
}

function resetAll(){

 if(timer){
   clearInterval(timer);
 }

 running = false;

 document.getElementById("startBtn").disabled = false;

 document.querySelectorAll(".flag").forEach(f=>f.remove());

 document.getElementById("history").innerHTML = "";

 document.getElementById("car").style.left = "40px";

 document.getElementById("viewport").scrollLeft = 0;

 document.getElementById("result").innerHTML =
 "速度を設定してスタートしてください";
}
</script>

</body>
</html>

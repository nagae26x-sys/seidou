<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>制動距離シミュレーター</title>

<style>
body{
    font-family: "Yu Gothic", sans-serif;
    margin:20px;
    text-align:center;
    background:#f5f5f5;
}

h1{
    margin-bottom:20px;
}

.control{
    margin:12px;
}

label{
    font-weight:bold;
}

input, select{
    font-size:1.1rem;
    padding:6px;
}

button{
    font-size:1.2rem;
    padding:10px 20px;
    cursor:pointer;
}

#road{
    width:900px;
    max-width:95%;
    height:120px;
    margin:30px auto;
    border:3px solid #444;
    background:#ddd;
    position:relative;
    overflow:hidden;
}

#car{
    position:absolute;
    left:0px;
    bottom:20px;
    font-size:50px;
}

#finish{
    position:absolute;
    right:5px;
    top:0;
    height:100%;
    display:flex;
    align-items:center;
    font-size:40px;
}

#result{
    margin-top:20px;
    font-size:1.5rem;
    font-weight:bold;
}

table{
    margin:20px auto;
    border-collapse:collapse;
}

th,td{
    border:1px solid #888;
    padding:8px 15px;
    background:white;
}
</style>
</head>

<body>

<h1>🚗 制動距離シミュレーター</h1>

<div class="control">
<label>速度 (km/h)</label>
<input type="number" id="speed" value="40" min="10" max="100">
</div>

<div class="control">
<label>路面状態</label>
<select id="surface">
<option value="0.01">乾燥</option>
<option value="0.015">濡れ</option>
<option value="0.03">雪道</option>
<option value="0.06">凍結路</option>
</select>
</div>

<div class="control">
<button onclick="startSimulation()">スタート</button>
</div>

<div id="road">
<div id="car">🚗</div>
<div id="finish">🏁</div>
</div>

<div id="result">
速度：40 km/h<br>
制動距離：16.0 m
</div>

<h2>記録</h2>

<table>
<thead>
<tr>
<th>速度(km/h)</th>
<th>路面</th>
<th>制動距離(m)</th>
</tr>
</thead>
<tbody id="history">
</tbody>
</table>

<script>

let running = false;

function startSimulation(){

    if(running) return;

    running = true;

    const speed =
        Number(document.getElementById("speed").value);

    const k =
        Number(document.getElementById("surface").value);

    const surfaceText =
        document.getElementById("surface")
        .options[
            document.getElementById("surface").selectedIndex
        ].text;

    const distance =
        k * speed * speed;

    const car =
        document.getElementById("car");

    const road =
        document.getElementById("road");

    const roadWidth =
        road.clientWidth;

    car.style.left = "0px";

    const maxDistance =
        600;

    const target =
        Math.min(
            (distance / maxDistance) *
            (roadWidth - 80),
            roadWidth - 80
        );

    let pos = 0;

    let velocity =
        Math.max(speed / 10, 1);

    const timer =
        setInterval(() => {

            pos += velocity;

            velocity *= 0.985;

            car.style.left =
                pos + "px";

            if(pos >= target ||
               velocity < 0.2){

                clearInterval(timer);

                car.style.left =
                    target + "px";

                document.getElementById("result")
                .innerHTML =
                    `速度：${speed} km/h<br>
                     路面：${surfaceText}<br>
                     制動距離：${distance.toFixed(1)} m`;

                addHistory(
                    speed,
                    surfaceText,
                    distance.toFixed(1)
                );

                running = false;
            }

        },20);
}

function addHistory(
    speed,
    surface,
    distance
){

    const row =
        document.createElement("tr");

    row.innerHTML =
        `<td>${speed}</td>
         <td>${surface}</td>
         <td>${distance}</td>`;

    document
        .getElementById("history")
        .appendChild(row);
}


// ダブルタップ拡大抑制
let lastTouchEnd = 0;

document.addEventListener(
'touchend',
function(event){

    const now = Date.now();

    if(now - lastTouchEnd <= 300){
        event.preventDefault();
    }

    lastTouchEnd = now;

}, false);

</script>

</body>
</html>
